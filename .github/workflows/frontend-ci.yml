name: MediConnect Pro Frontend CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar interfaz
        run: npm run build
      - name: Instalar reporter compatible con Vitest
        run: npm install --no-save --package-lock=false @vitest/coverage-v8@4.1.12
      - name: Pruebas Vitest con cobertura real
        run: npm test -- --watch=false --coverage
      - name: Mostrar porcentajes reales de Vitest
        run: node scripts/report-coverage.cjs
      - name: Construir Docker multi-stage de producción
        run: docker build -t mediconnect-pro-ui:test .
      - name: Publicar cobertura para el jurado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-vitest
          path: coverage/
          if-no-files-found: warn
