name: MediConnect Pro Frontend CI
on:
  push:
    branches: [main, 'feature/interfaz-mediconnect']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar interfaz
        run: npm run build
      - name: Pruebas Vitest
        run: npm test -- --watch=false
